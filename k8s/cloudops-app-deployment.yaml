apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-app
  template:
    metadata:
      labels:
        app: cloudops-app
    spec:
      containers:
        - name: cloudops-app
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-app
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: cloudops-app
  ports:
    - port: 80
      targetPort: 80